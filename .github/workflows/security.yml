name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" # actionlint_1.7.12_linux_amd64.tar.gz
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507" # hadolint-linux-x86_64
  PYTHON_VERSION: "3.11" # matches the Dockerfile base image

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks detect --source . --redact --verbose --no-banner --exit-code 1

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit requirements
        run: |
          set -euo pipefail
          args=(-r requirements.txt)
          for f in requirements-dev.txt requirements_dev.txt dev-requirements.txt; do
            if [ -f "$f" ]; then args+=(-r "$f"); fi
          done
          pip-audit --strict --progress-spinner off "${args[@]}"

  semgrep:
    name: SAST (semgrep OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.181.0"
      - name: Scan
        # `--config auto` is refused with `--metrics=off`, so rulesets are listed explicitly.
        run: >-
          semgrep scan
          --config p/default
          --config p/python
          --config p/secrets
          --config p/github-actions
          --config p/dockerfile
          --error
          --metrics=off

  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: python -m pip install --disable-pip-version-check "bandit==1.9.4"
      - name: Scan (medium severity and above)
        run: bandit -r . -x ./.git,./venv,./.venv --severity-level medium --confidence-level low

  lint-config:
    name: Lint workflows and Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - name: actionlint
        run: actionlint -color
      - name: hadolint
        if: hashFiles('Dockerfile') != ''
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile
