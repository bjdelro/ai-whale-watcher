name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Lint debt report (non-blocking)
        # TODO(#9): rules ignored in ruff.toml; shown here as warnings until fixed.
        continue-on-error: true
        run: ruff check --isolated --select F401,F841,E402,E722,E711,E712 --exit-zero --statistics .

      - name: Type check (mypy)
        run: mypy src

      - name: Unit tests (pytest)
        run: pytest -q

      - name: Build (byte-compile)
        run: python -m compileall -q src *.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-whale-watcher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
