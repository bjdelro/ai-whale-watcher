target-version = "py311"
extend-exclude = ["experiments"]

[lint]
# Ruff defaults: pyflakes (F) + pycodestyle errors (E4, E7, E9).
select = ["E4", "E7", "E9", "F"]
# TODO(#9): existing lint debt. These rules are ignored so CI can gate on everything
# else; CI still reports them in a non-blocking step. Fix and remove them over time.
ignore = [
    "F401", # unused-import
    "F841", # unused-variable
    "E402", # module-import-not-at-top-of-file (scripts adjust sys.path first)
    "E722", # bare-except
    "E711", # none-comparison
    "E712", # true-false-comparison (SQLAlchemy filters use == True/False)
]
