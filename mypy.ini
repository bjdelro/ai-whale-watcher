[mypy]
python_version = 3.11
ignore_missing_imports = True
# TODO(#9): existing type debt (~250 errors). These codes are disabled so CI can gate
# on the rest (name-defined, operator, call-arg, etc.). Re-enable one at a time as code is fixed.
disable_error_code =
    arg-type,
    attr-defined,
    union-attr,
    assignment,
    return-value,
    return,
    var-annotated,
    misc,
    annotation-unchecked,
    valid-type
